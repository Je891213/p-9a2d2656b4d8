<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>全钟瑞监控</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<base target="_top">
<meta charset="utf-8">
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e7e9ee; --dim:#98a0ae; --accent:#6ea8fe;
    --naver:#03c75a; --theqoo:#f0932b; --pann:#eb4d4b; --dc:#7158e2; --gnews:#0ea5e9; --x:#4b5563;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f5f6f8; --panel:#fff; --panel2:#f0f2f5; --line:#e2e5ea;
           --fg:#1a1d23; --dim:#6b7280; --accent:#2563eb; }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,"Malgun Gothic","Microsoft YaHei",system-ui,sans-serif;
    padding-bottom:env(safe-area-inset-bottom)}

  header{position:sticky;top:0;z-index:20;background:var(--panel);
    border-bottom:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-top))}
  .bar{display:flex;align-items:center;gap:10px}
  h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.5px;white-space:nowrap;line-height:1}
  .upd{font-size:11px;color:var(--dim);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #refresh{border:none;background:var(--accent);color:#fff;font-weight:700;
    border-radius:999px;padding:7px 16px;font-size:13px;cursor:pointer;flex-shrink:0}
  #refresh:disabled{opacity:.5}
  /* 补翻是次要动作，做成描边按钮，别跟「刷新」抢注意力 */
  #fixzh{border:1px solid var(--line);background:transparent;color:var(--dim);
    border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;flex-shrink:0}
  #fixzh:disabled{opacity:.5}
  .srow{display:flex;gap:8px;align-items:center;margin-top:9px}
  #q{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);
    color:var(--fg);border-radius:999px;padding:7px 14px;font-size:13.5px;
    font-family:inherit;outline:none;-webkit-appearance:none}
  #q:focus{border-color:var(--accent)}
  #q::-webkit-search-cancel-button{-webkit-appearance:none}
  #qx{border:none;background:var(--panel2);color:var(--dim);border-radius:999px;
    width:30px;height:30px;font-size:17px;line-height:1;cursor:pointer;flex-shrink:0}
  #qx[hidden]{display:none}
  .hint{margin-top:7px;font-size:12px;color:var(--dim);display:flex;
    align-items:center;gap:8px;flex-wrap:wrap}
  .hint[hidden]{display:none}
  .hint button{border:1px solid var(--accent);background:transparent;color:var(--accent);
    border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;cursor:pointer;
    font-family:inherit}
  .hint button:disabled{opacity:.5}
  .hint .warn{color:var(--theqoo)}

  .chips{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px;
    scrollbar-width:none}
  .chips2{margin-top:6px}
  /* 折叠筛选栏的小按钮：靠右、无底色，别跟上面的刷新按钮抢注意力 */
  .fold{display:block;margin:8px 0 0 auto;border:none;background:transparent;
    color:var(--dim);font-size:12px;cursor:pointer;padding:2px}
  #filters[hidden]{display:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--dim);
    border-radius:999px;padding:4px 12px;font-size:12.5px;white-space:nowrap;flex-shrink:0}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

  main{padding:12px 12px 40px;max-width:820px;margin:0 auto}
  a.card{display:block;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px;
    color:inherit;text-decoration:none}
  a.card:active{background:var(--panel2)}
  .zh{font-size:15.5px;font-weight:650;word-break:break-word;line-height:1.45}
  .ko{color:var(--dim);font-size:12.5px;margin-top:4px;word-break:break-word}
  /* DC 帖子的正文摘要。左边一道竖线跟标题区分开，别抢标题的视线 */
  .body{margin-top:6px;padding-left:8px;border-left:2px solid var(--line);
    font-size:13px;line-height:1.5;word-break:break-word}
  .body .bko{color:var(--dim);font-size:12px;margin-top:2px}
  .row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:8px;
    font-size:11.5px;color:var(--dim)}
  .tag{border-radius:4px;padding:1.5px 7px;font-weight:800;color:#fff;font-size:10.5px}
  .t-naver{background:var(--naver)} .t-theqoo{background:var(--theqoo)}
  .t-pann{background:var(--pann)} .t-dc{background:var(--dc)}
  .t-gnews{background:var(--gnews)}
  .t-x{background:var(--x)}
  .card.x{border-left-color:var(--x)}
  .card.gnews{border-left-color:var(--gnews)}
  .who{border:1px solid var(--line);border-radius:4px;padding:1.5px 7px;
    font-size:12.5px;font-weight:600}
  .emo{font-size:15px;line-height:1}
  .toggle{border-style:dashed}
  .loose{border:1px dashed var(--line);border-radius:4px;padding:0 6px;font-size:10.5px;opacity:.8}
  .card.naver{border-left-color:var(--naver)} .card.theqoo{border-left-color:var(--theqoo)}
  .card.pann{border-left-color:var(--pann)} .card.dc{border-left-color:var(--dc)}

  .msg{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px;line-height:2}
  .spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #pull{text-align:center;font-size:12px;color:var(--dim);height:0;overflow:hidden;
    transition:height .18s}
  .stale{color:var(--pann)}

  /* 后台静默刷新时，如果用户正在往下翻，不抽走内容，弹这个让他自己点。
     top 由 showPill() 按 header 实际高度算——header 有两行筛选条，
     换行与否高度会变，写死会盖住筛选按钮 */
  #pill{position:fixed;left:50%;transform:translateX(-50%);top:140px;
    z-index:30;background:var(--accent);color:#fff;font-size:13px;font-weight:700;
    border:none;border-radius:999px;padding:8px 18px;cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.28)}
  #pill[hidden]{display:none}
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1 id="h1">🦊</h1>
    <span class="upd" id="upd">载入中…</span>
    <button id="fixzh" title="给还没有中文译名的条目补翻（Gemini 忙的时候入库那一刻会翻不出来）">补翻</button>
    <button id="refresh">刷新</button>
  </div>
  <div class="srow">
    <input id="q" type="search" autocomplete="off" enterkeyhint="search"
           placeholder="筛选当前内容；想搜别人按回车（韩文名最准）">
    <button id="qx" hidden aria-label="清空">×</button>
  </div>
  <div class="hint" id="hint" hidden></div>
  <button id="foldBtn" class="fold" aria-expanded="true">收起筛选 ▴</button>
  <!-- 两行筛选包在一个容器里整体折叠：渲染时会重画 chipsSrc/chipsWho 本身，
       折叠状态挂在外层才不会被重画冲掉 -->
  <div id="filters">
    <div class="chips" id="chipsSrc"></div>
    <div class="chips chips2" id="chipsWho"></div>
  </div>
</header>

<div id="pull">松手刷新</div>
<button id="pill" hidden></button>
<main><div id="list"><div class="msg"><div class="spin"></div>载入中…</div></div></main>

<script>
/* 这份页面不在 script.google.com 里跑，没有原生的 google.script.run。
   下面用 fetch 做一个同名同形的替身，页面其余代码一行不用改。 */
var API = 'https://script.google.com/macros/s/AKfycbzecV5t-U7CqkE1-etL6SKFGdQUVaitIJ6qXcBCQNJSvy5pU-FboksZl_IWtkN6JpIP/exec';
function makeRunner(){
  var ok = null, fail = null;
  function call(fn, args){
    fetch(API + '?api=' + fn + '&args=' + encodeURIComponent(JSON.stringify(args)),
          { credentials: 'omit', redirect: 'follow' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d){ if(d && d.error) throw new Error(d.error); if(ok) ok(d.result); })
      .catch(function(err){ if(fail) fail(err); });
  }
  var o = {
    withSuccessHandler: function(f){ ok = f; return o; },
    withFailureHandler: function(f){ fail = f; return o; },
    getFeed:    function(force, only){ call('getFeed', [force, only]); },
    refreshNow: function(only){ call('refreshNow', [only]); },
    searchWeb:  function(kw){ call('searchWeb', [kw]); },
    feedStamp:  function(){ call('feedStamp', []); },
    retranslateMissing: function(n){ call('retranslateMissing', [n]); }
  };
  return o;
}
var google = { script: { get run(){ return makeRunner(); } } };
</script>
<script>
// 单人版模式。由 doGet 按网址上的 ?only= 注入，空串 = 正常双人看板。
// 后端已经按这个把别人的内容切掉了，这里只管界面上别再显示人名筛选
var ONLY = new URLSearchParams(location.search).get('only') || '';   // 原来由后端注入，静态版改从网址读

var SRC = {naver:'NAVER 新闻', gnews:'英文新闻', x:'X（推特）', theqoo:'theqoo', pann:'Nate Pann', dc:'DC Inside'};
var EMOJI = {};   // 人名 -> 标识，由后端下发
// 筛选选择记在本地，关掉页面重开还是上次那套
function pref(k, def){
  try { var v = localStorage.getItem(k); return v === null ? def : v; }
  catch(e){ return def; }
}
function setPref(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

var data = [], busy = false, updatedAt = '';
var fSrc = pref('fSrc', 'all'), fWho = pref('fWho', 'all');
var harvestedAt = '';   // 后台上次收割的时间，用来告诉你内容有多新
var pending = null;     // 静默刷新拿到、但先不渲染的数据（你正翻着呢，别把内容抽走）
var lastLoad = 0;

var AUTO_MS = 60 * 1000;        // 自动刷新间隔
var BACK_MS = 2 * 60 * 1000;    // 从后台切回来时，离开超过这么久就顺手查一下
var stamp = '';                 // 上次看到的库指纹，用来判断有没有必要拉全量

var q = '';                     // 搜索框内容
var webItems = null;            // 全网搜索结果；null = 正常看板模式
var searchKw = '';              // 这批搜索结果对应的关键词
var searching = false;

// 只看标题里直接出现名字的。默认开，关掉会把正文捎带提到的也放进来（噪音明显变大）
var strictOnly = pref('strictOnly', '1') !== '0';

// 当前开关下的可见集合，筛选按钮上的计数也基于它，免得数字对不上。
// 搜索结果不走「只看标题提到」开关——那是给库里内容去噪的，
// 搜索本来就已经按关键词卡过标题了
function base(){
  if(webItems) return webItems;
  return strictOnly ? data.filter(function(i){ return i.strict !== false; }) : data;
}

// 再叠上搜索框的即时筛选、以及来源/人名筛选
function visible(){
  var list = base();
  if(!webItems && q){
    var n = q.toLowerCase();
    list = list.filter(function(i){
      return ((i.title_zh || '') + ' ' + (i.title || '') + ' ' +
              (i.target || '') + ' ' + (i.meta || '')).toLowerCase().indexOf(n) >= 0;
    });
  }
  return list.filter(function(i){
    return (fSrc === 'all' || i.source === fSrc) && (fWho === 'all' || i.target === fWho);
  });
}

// 筛选按钮上要看得懂，所以 emoji + 名字
function withEmoji(name){
  var e = EMOJI[name];
  return e ? e + ' ' + name : name;
}

// 每条内容里只放 emoji 就够了，没配 emoji 才退回显示名字
function badge(name){
  var e = EMOJI[name];
  return e ? '<span class="emo">' + esc(e) + '</span>'
           : '<span class="who">' + esc(name) + '</span>';
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

function when(s){
  if(!s) return '';
  var d = new Date(s.replace(' ', 'T'));
  if(isNaN(d)) return '';
  var diff = (Date.now() - d) / 60000;
  if(diff < 1) return '刚刚';
  if(diff < 60) return Math.floor(diff) + ' 分钟前';
  if(diff < 1440) return Math.floor(diff / 60) + ' 小时前';
  if(diff < 10080) return Math.floor(diff / 1440) + ' 天前';
  return (d.getMonth() + 1) + '/' + d.getDate();
}

// posted 解析不出来的退回显示发现时间，但要标明是"发现于"，
// 不能拿抓到的时间冒充发帖时间
function timeLabel(it){
  if(it.posted) return when(it.posted);
  if(it.found_at) return '发现于 ' + when(it.found_at);
  return '';
}

function fillChips(box, list, current, pick){
  box.innerHTML = '';
  list.forEach(function(o){
    var c = document.createElement('span');
    c.className = 'chip' + (current === o[0] ? ' on' : '');
    c.textContent = o[1];
    c.onclick = function(){ pick(o[0]); render(); };
    box.appendChild(c);
  });
}

// 记着的选项这轮没有对应内容时，本轮先退回「全部」，但不覆盖存的偏好——
// 等那个来源/人名又有内容了，选择自己会回来
function stillThere(list, cur){
  if(cur === 'all') return true;
  for(var i = 0; i < list.length; i++) if(list[i][0] === cur) return true;
  return false;
}

function renderChips(){
  var b = base();

  // 第一行：来源。第二行：人名 + 严格开关。别挤在一行里
  var srcList = [['all', '全部来源']];
  Object.keys(SRC).forEach(function(k){
    var n = b.filter(function(i){ return i.source === k; }).length;
    if(n) srcList.push([k, SRC[k] + ' ' + n]);
  });
  if(!stillThere(srcList, fSrc)) fSrc = 'all';
  fillChips(document.getElementById('chipsSrc'), srcList, fSrc,
    function(v){ fSrc = v; if(!webItems) setPref('fSrc', v); });

  var whoList = [['all', '全部对象']], seen = {};
  b.forEach(function(i){
    if(!seen[i.target]){
      seen[i.target] = 1;
      var n = b.filter(function(x){ return x.target === i.target; }).length;
      whoList.push([i.target, withEmoji(i.target) + ' ' + n]);
    }
  });
  if(!stillThere(whoList, fWho)) fWho = 'all';
  var whoBox = document.getElementById('chipsWho');
  // 单人版：就一个人，人名筛选没意义。但「只看标题提到」的开关还得留着
  if(ONLY) whoList = [];
  fillChips(whoBox, whoList, fWho,
    function(v){ fWho = v; if(!webItems) setPref('fWho', v); });

  // 开关：开=只看标题直接提到名字的；关=正文捎带提到的也显示。
  // 搜索结果里没这回事，不显示这个开关
  if(webItems) return;
  var loose = data.length - data.filter(function(i){ return i.strict !== false; }).length;
  var t = document.createElement('span');
  t.className = 'chip toggle' + (strictOnly ? ' on' : '');
  t.textContent = strictOnly ? '🎯 只看标题提到' : '全都看 +' + loose;
  t.onclick = function(){
    strictOnly = !strictOnly;
    setPref('strictOnly', strictOnly ? '1' : '0');
    render();
  };
  whoBox.appendChild(t);
}


// 搜索框下面那行提示：告诉你现在是在筛本地还是在看全网结果
function renderHint(){
  var h = document.getElementById('hint');
  h.innerHTML = '';

  if(webItems){
    h.hidden = false;
    h.appendChild(document.createTextNode(
      '全网搜「' + searchKw + '」· ' + webItems.length + ' 条 · '));
    var w = document.createElement('span');
    w.className = 'warn';
    w.textContent = '不含 theqoo（它没有搜帖功能）';
    h.appendChild(w);
    var back = document.createElement('button');
    back.textContent = '返回看板';
    back.onclick = exitSearch;
    h.appendChild(back);
    return;
  }

  if(!q){ h.hidden = true; return; }
  h.hidden = false;
  h.appendChild(document.createTextNode('当前内容里 ' + visible().length + ' 条 · '));
  var go = document.createElement('button');
  go.textContent = searching ? '搜索中…' : '去全网搜「' + q + '」';
  go.disabled = searching;
  go.onclick = doWebSearch;
  h.appendChild(go);
}

function render(){
  renderChips();
  renderHint();

  var upd = document.getElementById('upd');
  if(webItems){
    upd.textContent = '搜索结果 ' + webItems.length + ' 条 · 现抓的';
    upd.className = 'upd';
  } else {
    // 显示内容有多新。看板是读库的，所以真正该报的是「后台上次收割是什么时候」，
    // 不是「这个页面什么时候读的库」
    var age = harvestedAt ? (Date.now() - new Date(harvestedAt)) / 60000 : -1;
    upd.textContent = '共 ' + base().length + ' 条' +
      (harvestedAt ? ' · ' + when(harvestedAt) + '抓取' : ' · 后台还没收割过');
    // 超过一小时没收割，多半是定时任务没装或者挂了，标红提醒
    upd.className = 'upd' + (age < 0 || age > 60 ? ' stale' : '');
  }

  var shown = visible();
  var list = document.getElementById('list');
  if(!shown.length){
    list.innerHTML = webItems
      ? '<div class="msg">「' + esc(searchKw) + '」没搜到东西<br>' +
        '试试韩文原名——NAVER 和 DC 对中文名基本搜不到</div>'
      : (q
        ? '<div class="msg">当前内容里没有「' + esc(q) + '」<br>' +
          '点上面的「去全网搜」真去搜一下</div>'
        : '<div class="msg">这个筛选下没有内容<br>换个来源看看，或者点右上角刷新</div>');
    return;
  }
  var html = '';
  shown.slice(0, 300).forEach(function(it){
    html += '<a class="card ' + it.source + '" href="' + esc(it.url) + '" target="_blank" rel="noopener">'
      + '<div class="zh">' + esc(it.title_zh || it.title) + '</div>'
      + (it.title_zh ? '<div class="ko">' + esc(it.title) + '</div>' : '')
      // DC 帖子正文（搜索结果自带的摘要，一般很短）。有译文就中文在上、原文在下
      + (it.body
          ? '<div class="body">' + esc(it.body_zh || it.body)
            + (it.body_zh ? '<div class="bko">' + esc(it.body) + '</div>' : '')
            + '</div>'
          : '')
      + '<div class="row"><span class="tag t-' + it.source + '">' + esc(SRC[it.source] || it.source) + '</span>'
      + badge(it.target)
      + (it.strict === false ? '<span class="loose">正文捎带</span>' : '')
      + (it.meta ? '<span>' + esc(it.meta) + '</span>' : '')
      + '<span>' + timeLabel(it) + '</span></div></a>';
  });
  list.innerHTML = html;
}

function showPill(n){
  var p = document.getElementById('pill');
  // 贴在 header 正下方。header 是 sticky 的，滚动时它的 bottom 就是自身高度；
  // 筛选条多一行就高一截，所以每次都现算，别写死
  var hd = document.querySelector('header');
  if(hd) p.style.top = (hd.getBoundingClientRect().bottom + 8) + 'px';
  p.textContent = '↑ ' + n + ' 条新内容';
  p.hidden = false;
}
function hidePill(){ document.getElementById('pill').hidden = true; }

function onData(d, silent){
  EMOJI = d.emoji || {};
  if(d.title) document.getElementById('h1').textContent = d.title;
  updatedAt = (d.updated_at || '').replace('T', ' ').slice(5, 16);
  harvestedAt = d.harvested_at || '';
  if(d.stamp) stamp = d.stamp;   // 对齐轮询基准，免得下一分钟误判成"变了"
  var incoming = d.items || [];

  // 你正在看全网搜索结果：库该更还是更，但别把屏幕上的东西换掉
  if(webItems){ data = incoming; return; }

  // 静默刷新时如果你已经往下翻了，别把正在看的内容换掉，
  // 改成弹个小按钮，你想看再点
  if(silent && window.scrollY > 200){
    var old = {};
    data.forEach(function(i){ old[i.id] = 1; });
    var fresh = incoming.filter(function(i){ return !old[i.id]; }).length;
    if(fresh){ pending = incoming; showPill(fresh); }
    return;
  }
  data = incoming;
  pending = null;
  hidePill();
  render();
}

/**
 * mode:
 *   'init' 首次载入 —— 读库，允许吃缓存，最快
 *   'auto' 后台静默刷新 —— 读库，跳过缓存，不动任何 UI
 *   'deep' 你点了刷新 —— 真去抓一次新的再读库（约 5 秒）
 *
 * 'init' / 'auto' 都只是读库，基本是秒回；只有 'deep' 才真的去请求那几个站点。
 */
function load(mode){
  if(busy) return;
  busy = true;
  lastLoad = Date.now();
  var btn = document.getElementById('refresh');
  var deep = mode === 'deep';

  if(mode !== 'auto'){
    btn.disabled = true;
    btn.textContent = deep ? '抓取中' : '载入中';
  }
  function done(){
    busy = false;
    btn.disabled = false;
    btn.textContent = '刷新';
  }

  var call = google.script.run
    .withSuccessHandler(function(json){
      try { onData(JSON.parse(json), mode === 'auto'); } catch(err){}
      done();
    })
    .withFailureHandler(function(e){
      // 静默刷新失败就当没发生过，别把你正在看的列表换成报错页
      if(mode !== 'auto'){
        document.getElementById('list').innerHTML =
          '<div class="msg">载入失败了<br>' + esc(e && e.message ? e.message : e) +
          '<br>再点一次刷新试试</div>';
      }
      done();
    });

  if(deep) call.refreshNow(ONLY);
  else call.getFeed(mode !== 'init', ONLY);
}

document.getElementById('refresh').onclick = function(){ load('deep'); };

// 折叠筛选栏。手机上这两行占掉不少高度，收起来能多看两条内容；选择记在本地，下次打开还是上次那样
(function(){
  var btn = document.getElementById('foldBtn');
  var box = document.getElementById('filters');
  function apply(folded){
    box.hidden = folded;
    btn.textContent = folded ? '展开筛选 ▾' : '收起筛选 ▴';
    btn.setAttribute('aria-expanded', folded ? 'false' : 'true');
  }
  var folded = pref('fold', '0') === '1';
  apply(folded);
  btn.onclick = function(){
    folded = !folded;
    setPref('fold', folded ? '1' : '0');
    apply(folded);
  };
})();

/**
 * 补翻：给库里没有中文译名的条目补上。
 *
 * 单独一个按钮、不塞进「刷新」里 —— 每条内容只在入库那一刻翻一次，
 * 撞上 Gemini 忙就永远空着；但补翻要逐批调模型，很慢（60 条约 40 秒），
 * 挂在刷新上会让每次刷新都多等半分多钟。所以分开，想补的时候再点。
 */
document.getElementById('fixzh').onclick = function(){
  var b = this;
  if(b.disabled) return;
  b.disabled = true;
  b.textContent = '补翻中';
  function finish(text, reload){
    b.textContent = text;
    if(reload) load('auto');
    setTimeout(function(){ b.textContent = '补翻'; b.disabled = false; }, 3000);
  }
  google.script.run
    .withSuccessHandler(function(r){
      if(!r || !r.done){ finish('没有要补的', false); return; }
      finish('补了 ' + r.done + ' 条' + (r.left ? '，还剩 ' + r.left : ''), true);
    })
    .withFailureHandler(function(e){
      finish('补翻失败', false);
    })
    .retranslateMissing(60);
};
document.getElementById('pill').onclick = function(){
  if(pending){ data = pending; pending = null; }
  hidePill();
  render();
  window.scrollTo({top:0, behavior:'smooth'});
};


// ---------------- 搜索 ----------------

/**
 * 去全网搜一个库里没有的人/关键词。
 * 这个是真去请求 NAVER/Pann/DC，约 5~10 秒，而且会调 Gemini 翻译结果——
 * 跟每分钟那个轮询不是一回事，那个不花钱。
 * 同一个词后端缓存 30 分钟，反复搜不会重复花。
 */
function doWebSearch(){
  var kw = q.trim();
  if(!kw || searching) return;
  searching = true;
  renderHint();
  document.getElementById('list').innerHTML =
    '<div class="msg"><div class="spin"></div>正在全网搜「' + esc(kw) + '」…<br>' +
    '要跑 NAVER / Pann / DC 三个站，约 5~10 秒</div>';
  hidePill();

  google.script.run
    .withSuccessHandler(function(json){
      searching = false;
      var d = {};
      try { d = JSON.parse(json); } catch(e){}
      webItems = d.items || [];
      searchKw = d.keyword || kw;
      // 搜索结果的来源分布跟看板不一样，筛选临时重置。
      // 只改内存不写偏好，退出搜索时你原来的选择会回来
      fSrc = 'all'; fWho = 'all';
      render();
      window.scrollTo({top:0, behavior:'smooth'});
    })
    .withFailureHandler(function(e){
      searching = false;
      document.getElementById('list').innerHTML =
        '<div class="msg">搜索失败了<br>' + esc(e && e.message ? e.message : e) +
        '<br>再点一次试试</div>';
      renderHint();
    })
    .searchWeb(kw);
}

function exitSearch(){
  webItems = null; searchKw = ''; q = '';
  document.getElementById('q').value = '';
  document.getElementById('qx').hidden = true;
  fSrc = pref('fSrc', 'all'); fWho = pref('fWho', 'all');   // 回看板，恢复你原来的筛选
  render();
}

var qEl = document.getElementById('q');
qEl.addEventListener('input', function(){
  q = qEl.value.trim();
  document.getElementById('qx').hidden = !qEl.value;
  // 一改输入框就退出搜索结果视图。不然屏幕上是旧结果、框里是新词，看着像卡住了
  if(webItems){ webItems = null; searchKw = ''; }
  render();
});
qEl.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); qEl.blur(); doWebSearch(); }
});
document.getElementById('qx').onclick = exitSearch;

// 下拉刷新
var startY = 0, pulling = false;
var pull = document.getElementById('pull');
document.addEventListener('touchstart', function(e){
  if(window.scrollY <= 0 && !busy){ startY = e.touches[0].clientY; pulling = true; }
}, {passive:true});
document.addEventListener('touchmove', function(e){
  if(!pulling) return;
  var dy = e.touches[0].clientY - startY;
  pull.style.height = dy > 0 ? Math.min(dy / 2, 44) + 'px' : '0';
}, {passive:true});
document.addEventListener('touchend', function(){
  if(!pulling) return;
  var h = parseFloat(pull.style.height) || 0;
  pull.style.height = '0';
  pulling = false;
  if(h >= 40) load('deep');   // 下拉是明确的"给我抓新的"，所以走深抓
}, {passive:true});

/**
 * 每分钟查一次「库变没变」。
 *
 * 关键是先问 feedStamp()（只回一个几十字节的指纹），没变就到此为止——
 * 库其实每 HARVEST_EVERY_MINUTES 分钟才变一回，
 * 不这么做的话每分钟都要整表读一遍，等于把同一份数据读三十遍。
 */
function poll(){
  if(busy || document.visibilityState !== 'visible') return;
  google.script.run
    .withSuccessHandler(function(s){
      if(s && s !== stamp){
        stamp = s;
        load('auto');
      }
    })
    .withFailureHandler(function(){})   // 探针失败就等下一分钟，不打扰
    .feedStamp();
}

setInterval(poll, AUTO_MS);

// 从后台切回来时查一下。手机上加到主屏当 App 用的话，
// 页面会在后台挂很久，回来还盯着几小时前的内容就没意义了
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && Date.now() - lastLoad > BACK_MS) poll();
});

load('init');
</script>
